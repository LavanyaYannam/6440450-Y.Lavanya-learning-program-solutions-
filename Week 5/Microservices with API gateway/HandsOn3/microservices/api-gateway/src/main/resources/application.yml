server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: greet-service
          uri: lb://greet-service
          predicates:
            - Path=/greet-service/**
      default-filters:
        - AddRequestHeader=X-Gateway-App, Spring-Cloud-Gateway

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
